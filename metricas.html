<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Métricas — Nerd Vestibulares</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #05070c; color: #ffffff; margin: 0; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 28px; max-width: 800px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
        h1 { color: #38bdf8; text-align: center; margin-top: 0; font-size: 24px; font-weight: 800; }
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card-stat { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.12); padding: 18px; border-radius: 14px; text-align: center; }
        .stat-val { font-size: 26px; font-weight: 800; color: #38bdf8; margin-bottom: 4px; }
        .stat-label { font-size: 11px; color: #cbd5e1; text-transform: uppercase; font-weight: 700; }
        .btn-action { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; border: none; padding: 14px; width: 100%; font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; text-align: center; text-decoration: none; display: block; }
        .btn-action:hover { filter: brightness(1.15); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Dashboard de Métricas</h1>
        
        <div class="grid-stats">
            <div class="card-stat">
                <div class="stat-val" id="statXp">0</div>
                <div class="stat-label">XP Total Acumulado</div>
            </div>
            <div class="card-stat">
                <div class="stat-val" id="statRespondidas">0</div>
                <div class="stat-label">Questões Respondidas</div>
            </div>
            <div class="card-stat">
                <div class="stat-val" id="statTaxa">0%</div>
                <div class="stat-label">Aproveitamento Geral</div>
            </div>
        </div>

        <a href="index.html" class="btn-action">↩️ Voltar ao Menu Principal</a>
    </div>

    <script>
        window.onload = function() {
            const salvo = localStorage.getItem('nerd_vestibulares_perfil_usuario');
            if (salvo) {
                const dados = JSON.parse(salvo);
                document.getElementById('statXp').innerText = dados.xp || 0;
                
                const historico = dados.questoesRespondidasHistorico || {};
                const ids = Object.keys(historico);
                const total = ids.length;
                
                let acertos = 0;
                ids.forEach(id => {
                    if (historico[id] === 'acertou') acertos++;
                });

                document.getElementById('statRespondidas').innerText = total;
                const taxa = total > 0 ? Math.round((acertos / total) * 100) : 0;
                document.getElementById('statTaxa').innerText = taxa + '%';
            }
        };
    </script>
</body>
</html>
