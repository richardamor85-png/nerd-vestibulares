<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerd Vestibulares — Estatísticas e Métricas</title>
    <!-- Chamada do Manifesto PWA -->
    <link rel="manifest" href="manifest.json">
    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #070913; color: #f8fafc; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: background 0.3s, color 0.3s; }

        /* Sincronizado com o Modo Claro / Escuro salvo no Jogo */
        body.light-theme { background: #f1f5f9; color: #1e293b; }
        body.light-theme .card-section, body.light-theme .sidebar-nav, body.light-theme .filters-container, body.light-theme .card-header, body.light-theme .sub-controls, body.light-theme .table-footer { background: #ffffff !important; color: #1e293b !important; border-color: #cbd5e1 !important; }
        body.light-theme .data-table th { background: #f8fafc !important; color: #475569 !important; }
        body.light-theme .data-table td { border-color: #e2e8f0 !important; color: #334155 !important; }
        body.light-theme .data-table tr:hover { background: #f1f5f9 !important; }
        body.light-theme .filter-group input, body.light-theme .filter-group select { background: #f8fafc; color: #1e293b; border-color: #cbd5e1; }

        /* Topo / Breadcrumb */
        .top-bar { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .breadcrumb { font-size: 14px; color: #94a3b8; font-weight: 500; }
        .breadcrumb span { color: #38bdf8; font-weight: 600; }

        /* Barra de Filtros Reais do Jogo */
        .filters-container { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 15px; width: 100%; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) auto; gap: 10px; align-items: flex-end; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .filter-group input, .filter-group select { padding: 8px; border: 1px solid #475569; border-radius: 6px; font-size: 13px; background: #0f172a; color: #f8fafc; }
        .btn-filtrar { background: #0ea5e9; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; height: 37px; }
        .btn-filtrar:hover { filter: brightness(1.1); }

        /* Layout Principal */
        .main-layout { display: flex; width: 100%; max-width: 1200px; gap: 20px; align-items: flex-start; }
        
        /* Menu Lateral Esquerdo */
        .sidebar-nav { background: #1e293b; border: 1px solid #334155; border-radius: 8px; width: 60px; display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .nav-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; color: #94a3b8; font-size: 18px; transition: 0.2s; text-decoration: none; }
        .nav-icon:hover { background: #334155; color: #38bdf8; }
        .nav-icon.active { background: #0f172a; color: #38bdf8; border-left: 4px solid #38bdf8; }

        /* Conteúdo Dinâmico */
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .tab-content { display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }

        /* Cards */
        .card-section { background: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-header { background: #0f172a; padding: 12px 18px; border-bottom: 1px solid #334155; font-weight: bold; font-size: 14px; color: #38bdf8; }
        .card-body { padding: 20px; font-size: 13px; color: #94a3b8; text-align: center; }

        /* Tabelas */
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; color: #f8fafc; }
        .data-table th, .data-table td { padding: 10px 15px; border-bottom: 1px solid #334155; }
        .data-table th { background: #0f172a; color: #94a3b8; font-weight: 600; }
        .data-table tr:hover { background: rgba(56, 189, 248, 0.05); }

        .table-footer { background: #0f172a; padding: 12px 18px; border-top: 1px solid #334155; font-size: 12px; font-weight: 600; color: #f8fafc; display: flex; gap: 20px; }

        /* Botão Exportar */
        .action-footer { display: flex; gap: 10px; margin-top: 5px; }
        .btn-action { border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; color: white; background: #3b82f6; box-shadow: 0 2px 4px rgba(59,130,246,0.3); }
        .btn-action:hover { filter: brightness(1.1); }

        .chart-container { position: relative; width: 100%; height: 260px; padding: 10px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="breadcrumb">Estatísticas > <span id="breadcrumbTitle">Desempenho</span></div>
    </div>

    <!-- Barra de Filtros Real do Jogo -->
    <div class="filters-container">
        <div class="filter-group">
            <label>Período</label>
            <select id="filtroPeriodo">
                <option value="todos" selected>Todo o Período</option>
                <option value="hoje">Hoje</option>
                <option value="7d">Últimos 7 dias</option>
                <option value="30d">Últimos 30 dias</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Aluno</label>
            <input type="text" id="filtroAluno" value="Richard" readonly>
        </div>
        <div class="filter-group">
            <label>Disciplina</label>
            <select id="filtroDisciplina">
                <option value="Todos" selected>🌐 Todas as Disciplinas</option>
                <option value="Historia">🏛️ História</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Tópico Principal</label>
            <select id="filtroTopico">
                <option value="Todos" selected>📂 Todos os Tópicos</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Subtópico</label>
            <select id="filtroSubtopico">
                <option value="Todos" selected>📌 Todos os Subtópicos</option>
            </select>
        </div>
        <button class="btn-filtrar" onclick="aplicarFiltros()">FILTRAR</button>
    </div>

    <div class="main-layout">
        
        <!-- Menu Lateral -->
        <div class="sidebar-nav">
            <div class="nav-icon active" onclick="trocarAba(0, 'Desempenho')" title="Desempenho por Matéria">📊</div>
            <div class="nav-icon" onclick="trocarAba(1, 'Minha evolução')" title="Evolução do Desempenho">📈</div>
            <div class="nav-icon" onclick="trocarAba(2, 'Atividades')" title="Atividades e Histórico">🕒</div>
            <a href="index.html" class="nav-icon" title="Voltar ao Jogo">🚪</a>
        </div>

        <div class="content-area">

            <!-- ABA 1: DESEMPENHO -->
            <div id="aba0" class="tab-content active">
                <div class="card-section">
                    <div class="card-header">Desempenho Geral</div>
                    <div class="card-body" id="geralBody">Carregando dados...</div>
                </div>

                <div class="card-section">
                    <div class="card-header">Desempenho por Matéria e Assunto</div>
                    <div id="tabelaMateriaContainer"></div>
                    <div class="table-footer" id="tabelaFooterResumo">Resolvidas: 0 | Acertos: 0 | Erros: 0</div>
                </div>

                <div class="action-footer">
                    <button class="btn-action" onclick="acaoExportarPlanilha()">📥 EXPORTAR PARA PLANILHA</button>
                </div>
            </div>

            <!-- ABA 2: EVOLUÇÃO -->
            <div id="aba1" class="tab-content">
                <div class="card-section">
                    <div class="card-header">Evolução do Desempenho (%)</div>
                    <div class="chart-container"><canvas id="chartEvolucao"></canvas></div>
                </div>
                <div class="card-section">
                    <div class="card-header">Evolução de Resoluções (Volume por Dia)</div>
                    <div class="chart-container"><canvas id="chartResolucoes"></canvas></div>
                </div>
            </div>

            <!-- ABA 3: ATIVIDADES -->
            <div id="aba2" class="tab-content">
                <div class="card-section">
                    <div class="card-header">Atividades Recentes e Histórico</div>
                    <div id="tabelaAtividadesContainer"></div>
                    <div class="table-footer" id="atividadesFooterResumo">Resolvidas: 0 | Acertos: 0 | Erros: 0</div>
                </div>

                <div class="action-footer">
                    <button class="btn-action" onclick="acaoExportarPlanilha()">📥 EXPORTAR PARA PLANILHA</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Importa o banco de questões -->
    <script src="questoes.js"></script>

    <script>
        let historicoGlobal = [];
        let meuGraficoEvolucao = null;
        let meuGraficoResolucao = null;

        window.onload = function() {
            carregarConfiguracaoTema();
            carregarOpcoesFiltros();
            carregarDadosLocalStorage();
            renderizarPainel();
        };

        function carregarConfiguracaoTema() {
            const configSalva = localStorage.getItem('nerd_vestibulares_config_motor');
            if (configSalva) {
                const conf = JSON.parse(configSalva);
                if (conf.tema === 'claro') {
                    document.body.classList.add('light-theme');
                } else {
                    document.body.classList.remove('light-theme');
                }
            }
        }

        function carregarOpcoesFiltros() {
            const selTopico = document.getElementById('filtroTopico');
            const selSub = document.getElementById('filtroSubtopico');
            
            let topicos = new Set();
            let subs = new Set();

            if (typeof masterDeck !== 'undefined') {
                masterDeck.forEach(c => {
                    if (c.topicoPrincipal) topicos.add(c.topicoPrincipal);
                    if (c.subgrupo) subs.add(c.subgrupo);
                });
            }

            topicos.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t; opt.innerText = t;
                selTopico.appendChild(opt);
            });

            subs.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s; opt.innerText = s;
                selSub.appendChild(opt);
            });
        }

        function carregarDadosLocalStorage() {
            let chaves = Object.keys(localStorage);
            let historicoUnificado = [];

            chaves.forEach(chave => {
                if (chave.includes('nerd_vestibulares_perfil_')) {
                    try {
                        let dados = JSON.parse(localStorage.getItem(chave));
                        if (dados.questoesRespondidasHistorico) {
                            for (let qId in dados.questoesRespondidasHistorico) {
                                let status = dados.questoesRespondidasHistorico[qId];
                                let cardObj = typeof masterDeck !== 'undefined' ? masterDeck.find(c => c.id == qId) : null;
                                
                                historicoUnificado.push({
                                    questaoId: qId,
                                    deck: cardObj ? cardObj.deck : "Historia",
                                    topicoPrincipal: cardObj ? (cardObj.topicoPrincipal || cardObj.subgrupo) : "Geral",
                                    acertou: (status === 'acertou'),
                                    data: new Date().toISOString().split('T')[0]
                                });
                            }
                        }
                    } catch(e) { console.error(e); }
                }
            });

            if (historicoUnificado.length === 0) {
                historicoUnificado = [
                    { questaoId: 1, deck: "Historia", topicoPrincipal: "Historiografia", acertou: true, data: "2026-10-20" },
                    { questaoId: 2, deck: "Historia", topicoPrincipal: "Revolução Francesa", acertou: false, data: "2026-10-20" }
                ];
            }

            historicoGlobal = historicoUnificado;
        }

        function trocarAba(index, tituloBreadcrumb) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.sidebar-nav .nav-icon').forEach(icon => icon.classList.remove('active'));

            document.getElementById('aba' + index).classList.add('active');
            document.querySelectorAll('.sidebar-nav .nav-icon')[index].classList.add('active');
            document.getElementById('breadcrumbTitle').innerText = tituloBreadcrumb;

            if (index === 1) { renderizarGraficos(); }
        }

        function aplicarFiltros() {
            const discFiltro = document.getElementById('filtroDisciplina').value;
            const topFiltro = document.getElementById('filtroTopico').value;

            carregarDadosLocalStorage();

            let filtrados = historicoGlobal.filter(h => {
                let matchDisc = (discFiltro === 'Todos' || h.deck === discFiltro);
                let matchTop = (topFiltro === 'Todos' || h.topicoPrincipal === topFiltro);
                return matchDisc && matchTop;
            });

            historicoGlobal = filtrados;
            renderizarPainel();
            alert("Filtros aplicados com sucesso!");
        }

        function renderizarPainel() {
            const corpoGeral = document.getElementById('geralBody');
            const containerTabela = document.getElementById('tabelaMateriaContainer');
            const containerAtiv = document.getElementById('tabelaAtividadesContainer');
            const footerResumo = document.getElementById('tabelaFooterResumo');
            const atividadesFooter = document.getElementById('atividadesFooterResumo');

            let totalResolvidas = historicoGlobal.length;
            let totalAcertos = historicoGlobal.filter(h => h.acertou).length;
            let totalErros = totalResolvidas - totalAcertos;
            let percentualAcerto = totalResolvidas > 0 ? Math.round((totalAcertos / totalResolvidas) * 100) : 0;

            corpoGeral.innerHTML = `
                <div style="display: flex; justify-content: space-around; font-weight: bold; color: #f8fafc;">
                    <div>Total Resolvidas: <span style="color:#38bdf8">${totalResolvidas}</span></div>
                    <div>Acertos: <span style="color:#10b981">${totalAcertos} (${percentualAcerto}%)</span></div>
                    <div>Erros: <span style="color:#ef4444">${totalErros} (${100 - percentualAcerto}%)</span></div>
                </div>
            `;

            let htmlTabela = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Matéria / Tópico</th>
                            <th>Questões Resolvidas</th>
                            <th>Acertos</th>
                            <th>Erros</th>
                            <th>Desempenho</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            let agrupado = {};
            historicoGlobal.forEach(h => {
                if(!agrupado[h.topicoPrincipal]) agrupado[h.topicoPrincipal] = { total: 0, acertos: 0, erros: 0 };
                agrupado[h.topicoPrincipal].total++;
                if(h.acertou) agrupado[h.topicoPrincipal].acertos++;
                else agrupado[h.topicoPrincipal].erros++;
            });

            for(let topico in agrupado) {
                let item = agrupado[topico];
                let perc = Math.round((item.acertos / item.total) * 100);
                htmlTabela += `
                    <tr>
                        <td><b>${topico}</b></td>
                        <td>${item.total}</td>
                        <td style="color: #10b981;">${item.acertos}</td>
                        <td style="color: #ef4444;">${item.erros}</td>
                        <td><span style="color:${perc >= 70 ? '#10b981':'#ef4444'}">${perc}%</span></td>
                    </tr>
                `;
            }
            htmlTabela += `</tbody></table>`;
            
            containerTabela.innerHTML = htmlTabela;
            containerAtiv.innerHTML = htmlTabela;

            let resumoTexto = `Resolvidas: ${totalResolvidas} | Acertos: ${totalAcertos} | Erros: ${totalErros}`;
            footerResumo.innerHTML = resumoTexto;
            atividadesFooter.innerHTML = resumoTexto;
        }

        function renderizarGraficos() {
            let totalAcertos = historicoGlobal.filter(h => h.acertou).length;
            let percTotal = historicoGlobal.length > 0 ? Math.round((totalAcertos / historicoGlobal.length) * 100) : 0;

            const ctxEvolucao = document.getElementById('chartEvolucao').getContext('2d');
            if (meuGraficoEvolucao) meuGraficoEvolucao.destroy();
            meuGraficoEvolucao = new Chart(ctxEvolucao, {
                type: 'line',
                data: {
                    labels: ['Início', 'Atual'],
                    datasets: [{
                        label: 'Desempenho Relativo (%)',
                        data: [50, percTotal],
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctxResolucao = document.getElementById('chartResolucoes').getContext('2d');
            if (meuGraficoResolucao) meuGraficoResolucao.destroy();
            meuGraficoResolucao = new Chart(ctxResolucao, {
                type: 'bar',
                data: {
                    labels: ['Hoje'],
                    datasets: [{
                        label: 'Número de Resoluções',
                        data: [historicoGlobal.length],
                        backgroundColor: '#10b981'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function acaoExportarPlanilha() {
            let csv = "Topico,Status\n" + historicoGlobal.map(h => `${h.topicoPrincipal},${h.acertou ? 'Acerto' : 'Erro'}`).join("\n");
            let blob = new Blob([csv], { type: 'text/csv' });
            let url = window.URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'relatorio_nerd_vestibulares.csv');
            a.click();
        }
    </script>
</body>
</html>
